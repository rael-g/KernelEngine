name: build and test

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ''
          - os: windows-latest
            exe: '.exe'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install windowing system headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorg-dev libgl1-mesa-dev libglu1-mesa-dev pkg-config

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore vcpkg
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/tools
            build/vcpkg-installed
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}

      - name: Restore clang resource headers
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .cache
          key: clang-resource-dir-${{ hashFiles('scripts/generate_bindings.cs') }}

      - name: Restore NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'src/csharp/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build native
        run: dotnet run scripts/verify.cs -- build

      - name: Save vcpkg
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/tools
            build/vcpkg-installed
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}

      - name: Show vcpkg build logs
        if: failure()
        run: |
          for f in build/tools/vcpkg-*/buildtrees/*/*-out.log build/tools/vcpkg-*/buildtrees/*/*-err.log; do
            [ -s "$f" ] && { echo "::group::$f"; tail -n 60 "$f"; echo "::endgroup::"; }
          done
          true

      - name: Native tests
        run: dotnet run scripts/verify.cs -- test-native

      - name: Managed tests
        run: dotnet run scripts/verify.cs -- test-managed

      - name: Gates
        if: runner.os == 'Linux'
        run: dotnet run scripts/verify.cs -- gates
