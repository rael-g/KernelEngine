name: build and test

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ''
          - os: windows-latest
            exe: '.exe'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install windowing system headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorg-dev libgl1-mesa-dev libglu1-mesa-dev pkg-config

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore vcpkg
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/tools
            build/vcpkg-installed
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}

      - name: Restore clang resource headers
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: build/cache
          key: clang-resource-dir-${{ hashFiles('src/csharp/kabic/Kabic.Bindings/ClangResourceDir.cs') }}

      - name: Restore Zig global cache
        id: zig-global-cache
        uses: actions/cache/restore@v4
        with:
          path: build/zig-global
          key: zig-global-${{ runner.os }}-${{ github.run_id }}
          restore-keys: zig-global-${{ runner.os }}-

      - name: Restore NuGet packages
        uses: actions/cache@v4
        with:
          path: build/nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build native
        run: dotnet run scripts/verify.cs -- build

      - name: Save Zig global cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/zig-global
          key: zig-global-${{ runner.os }}-${{ github.run_id }}

      - name: Save vcpkg
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/tools
            build/vcpkg-installed
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}

      - name: Show vcpkg build logs
        if: failure()
        run: |
          for f in build/tools/vcpkg-*/buildtrees/*/*-out.log build/tools/vcpkg-*/buildtrees/*/*-err.log; do
            [ -s "$f" ] && { echo "::group::$f"; tail -n 60 "$f"; echo "::endgroup::"; }
          done
          true

      - name: Native tests
        run: dotnet run scripts/verify.cs -- test-native

      - name: Managed tests
        run: dotnet run scripts/verify.cs -- test-managed

      - name: Gates
        if: runner.os == 'Linux'
        run: dotnet run scripts/verify.cs -- gates

      - name: Documentation site
        if: runner.os == 'Linux'
        run: dotnet run scripts/verify.cs -- docs

      - name: Upload documentation site
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs-site

  publish-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build the pinned ci image
        run: docker build -t ke-ci scripts/ci

      - name: Restore vcpkg
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/tools
            build/vcpkg-installed
          key: vcpkg-ke-ci-${{ hashFiles('scripts/ci/Dockerfile', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}

      - name: Build native and compare against the goldens
        run: |
          mkdir -p build/home
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/work/build/home -e DOTNET_CLI_HOME=/work/build/home \
            -v "$PWD:/work" -w /work ke-ci \
            dotnet run scripts/verify.cs -- build visual

      - name: Save vcpkg
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/tools
            build/vcpkg-installed
          key: vcpkg-ke-ci-${{ hashFiles('scripts/ci/Dockerfile', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}

      - name: Upload the captured images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-captures
          path: build/visual

  main-history:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit subjects on main are conventional commits
        env:
          RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: |
          untyped=$(git log --first-parent --format='%h %s' "$RANGE" | grep -vE '^[0-9a-f]+ (feat|fix|refactor|docs|test|chore)(\([a-z0-9-]+\))?: [^ ]' || true)
          [ -z "$untyped" ] || { echo "subjects that are not conventional commits:"; echo "$untyped"; }
          [ -z "$untyped" ]
