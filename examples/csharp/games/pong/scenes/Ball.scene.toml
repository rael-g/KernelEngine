[scene]
name    = "Ball"
version = 2

[[entity]]
name = "Root"
type = "Pong.Ball"

[[entity]]
name   = "Shape"
parent = "Root"
type   = "CollisionShape2D"
[entity.collider2d]
half_extents = [0.18, 0.18]
restitution  = 1.0
friction     = 0.0

[[entity]]
name   = "Visual"
parent = "Root"
type   = "Sprite2D"
[entity.transform]
scale = [0.36, 0.36, 1.0]
[entity.mesh]
mesh      = "quad"
color     = [0.95, 0.95, 0.95, 1.0]
roughness = 1.0

[[entity]]
name   = "HitSound"
parent = "Root"
type   = "AudioPlayer"
[entity.audio_player]
path   = "assets/sounds/hit.wav"
volume = 0.5

[[entity]]
name   = "ScoreSound"
parent = "Root"
type   = "AudioPlayer"
[entity.audio_player]
path   = "assets/sounds/score.wav"
volume = 0.6
