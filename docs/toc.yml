- name: Decisions
  items:
  - name: "0001. Each kind of documentation lives where something keeps it true"
    href: decisions/0001-each-kind-of-documentation-lives-where-something-keeps-it-true.md
  - name: "0002. An error record lives in per-thread storage and its message is copied, never allocated"
    href: decisions/0002-error-records-are-per-thread-and-never-allocate.md
  - name: "0003. A plugin sees only the domains it asked for"
    href: decisions/0003-one-include-path-per-domain.md
  - name: "0004. Behavior two plugins share is Zig source passed by the build, not a contract header"
    href: decisions/0004-shared-behavior-is-source-not-header.md
  - name: "0005. A system body records structural changes and the runtime applies them after the wave"
    href: decisions/0005-structural-change-recorded-then-applied.md
  - name: "0006. A failure crosses threads as an error type, and the waiter raises a fresh error"
    href: decisions/0006-failure-crosses-threads-as-a-type.md
  - name: "0007. Reserved entity ids come from a band the world never issues from"
    href: decisions/0007-entity-ids-reserved-from-a-band.md
  - name: "0008. The runtime orders render passes; there is no render graph object"
    href: decisions/0008-runtime-is-the-render-graph.md
  - name: "0009. Commands reach the GPU in command-slot order, chosen by each pass"
    href: decisions/0009-submission-order-by-command-slot.md
  - name: "0010. A pass is never made to wait for a pipeline compile"
    href: decisions/0010-pipeline-requests-never-wait.md
  - name: "0011. A lighting feature that is off binds a neutral resource instead of compiling another shader"
    href: decisions/0011-neutral-resources-not-shader-variants.md
  - name: "0012. Refraction is a term only the forward pass has"
    href: decisions/0012-refraction-is-forward-only.md
  - name: "0013. An authored material names no pass; the build binds it to each consuming pass"
    href: decisions/0013-material-bound-to-pass-by-the-build.md
  - name: "0014. View space and the device clip convention are two contracts"
    href: decisions/0014-view-space-independent-of-clip-convention.md
  - name: "0015. A native handle crosses assemblies through an explicitly implemented INative interface"
    href: decisions/0015-native-pointer-through-interface.md
  - name: "0016. A managed handler's exception is caught at the trampoline and rethrown by the next managed call"
    href: decisions/0016-handler-exceptions-do-not-cross-native-frames.md
  - name: "0017. A configuration read returns the caller's fallback and never fails"
    href: decisions/0017-configuration-read-never-fails.md
  - name: "0018. A cached asset is identified by the key alone, and the key is the path as authored"
    href: decisions/0018-asset-key-is-the-authored-path.md
  - name: "0019. A plugin exposes vtables behind one factory per header"
    href: decisions/0019-a-plugin-is-vtables-behind-one-factory.md
  - name: "0020. A plugin takes no mutex, condition variable or thread of its own"
    href: decisions/0020-the-scheduler-is-the-only-synchronisation.md
  - name: "0021. A failure is a ke_error, never an assert or an abort"
    href: decisions/0021-a-failure-is-a-ke-error-never-an-abort.md
  - name: "0022. The framework is a plugin reached through contracts"
    href: decisions/0022-the-framework-is-a-plugin-like-any-other.md
  - name: "0023. A tuning value is a parameter with a default, not a constant"
    href: decisions/0023-a-tuning-value-is-a-parameter.md
  - name: "0024. The correct shape is chosen over the one that is easy today"
    href: decisions/0024-the-narrow-path-is-chosen-over-the-easy-one.md
  - name: "0025. Each language is written to its own convention"
    href: decisions/0025-each-language-follows-its-own-convention.md
  - name: "0026. A native owner is a pointer with Dispose, not a SafeHandle"
    href: decisions/0026-no-safehandle-around-a-native-owner.md
  - name: "0027. A boolean crosses the ABI as bool"
    href: decisions/0027-a-boolean-crosses-the-abi-as-bool.md
  - name: "0028. The Zig cache and package directories stay at the repository root"
    href: decisions/0028-zig-cache-and-zig-pkg-stay-at-the-root.md
  - name: "0029. The render phase reads copies of query results, not live storage"
    href: decisions/0029-render-phase-reads-extracted-copies.md
  - name: "0030. The shape of a plugin where no language convention applies"
    href: decisions/0030-plugin-shape-where-no-language-convention-applies.md
